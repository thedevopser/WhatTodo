name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the test image
        run: make image

      - name: Lua syntax
        run: make syntax

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Packaging
        run: make check-packaging
